<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User database</title>
</head>
<body>
    <table id="userTable">
        <thead>
            <tr><th>Username</th><th>Email</th><th>Admin</th></tr>
        </thead>
        <tbody>
            <tr><td>Webmaster</td><td>example@email.com</td><td>X</td></tr>
            <tr><td>User123</td><td>user123@email.com</td><td>-</td></tr>
            <tr><td>AnotherUser222</td><td>another222@email.com</td><td>-</td></tr>
        </tbody>
    </table>

    <form id="userForm">
        <label for="input-username">Username:</label>
        <input type="text" id="input-username" required>

        <label for="input-email">Email:</label>
        <input type="email" id="input-email" required>

        <label for="input-admin">Admin:</label>
        <input type="checkbox" id="input-admin">

        <button type="submit" id="submit-data">Add to table</button>
    </form>

    <button id="empty-table">Empty table</button>


    <script>
        if(document.readyState !== "loading") {
            console.log("Document is ready!");
            initializeCode();
        } else {
            document.addEventListener("DOMContentLoaded", function() {
                console.log("Document is ready after waiting!");
                initializeCode();
            })
        }

        function initializeCode() {
            const form = document.getElementById("userForm");
            const emptyButton = document.getElementById("empty-table");

            form.addEventListener("submit", function(event) {
                event.preventDefault();

                const username = document.getElementById("input-username").value;
                const email = document.getElementById("input-email").value;
                const admin = document.getElementById("input-admin").checked;

                const tableBody = document.querySelector("tbody");

                let newRow = document.createElement("tr");

                let usernameCell = document.createElement("td");
                let emailCell = document.createElement("td");
                let adminCell = document.createElement("td");

                usernameCell.innerText = username;
                emailCell.innerText = email;

                if(admin) {
                    adminCell.innerText = "X";
                } else {
                    adminCell.innerText = "-";
                }

                newRow.appendChild(usernameCell);
                newRow.appendChild(emailCell);
                newRow.appendChild(adminCell);

                tableBody.appendChild(newRow);

                form.reset();
            })

            emptyButton.addEventListener("click", function() {
                const tableBody = document.querySelector("tbody");

                while(tableBody.firstChild) {
                    tableBody.removeChild(tableBody.firstChild);
                }
            })
        }
    </script>

</body>
</html>
